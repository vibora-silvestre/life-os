<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-links button {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links button:hover, .nav-links button.active {
            background-color: #e0e7ff;
            color: var(--accent-color);
        }

        /* Main Content */
        main {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px;
            max-width: 1200px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        /* Form elements & buttons */
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button.btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn:hover {
            background-color: var(--accent-hover);
        }

        /* Projects & Tasks Specific */
        .project-card {
            margin-bottom: 20px;
        }

        .project-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .task-item.done span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background-color: #f1f5f9;
        }

        /* Completed Tasks Accordion */
        .completed-section-container {
            margin-top: 12px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }

        .toggle-completed-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }

        .toggle-completed-btn:hover {
            color: var(--text-primary);
        }

        .completed-tasks-list {
            margin-top: 8px;
            padding-left: 8px;
            border-left: 2px solid var(--border-color);
        }

        /* Habits table */
        .habits-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .habits-table th, .habits-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }

        .habits-table th {
            background-color: #f8fafc;
        }

        .habit-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Analytics */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: var(--radius);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 8px;
            color: var(--accent-color);
        }

        .stat-sub {
            font-size: 12px;
            margin-top: 4px;
        }

        .text-success { color: var(--success-color); font-weight: 600; }
        .text-danger { color: var(--danger-color); font-weight: 600; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            width: 400px;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="logo">✨ Life OS</div>
        <ul class="nav-links">
            <li><button onclick="switchTab('habits')" id="nav-habits">🌱 Hábitos</button></li>
            <li><button onclick="switchTab('projects')" id="nav-projects">📋 Projetos & Tarefas</button></li>
            <li><button onclick="switchTab('finances')" id="nav-finances">💰 Finanças</button></li>
            <li><button onclick="switchTab('goals')" id="nav-goals">🎯 Metas</button></li>
            <li><button onclick="switchTab('calendar')" id="nav-calendar">📅 Calendário</button></li>
            <li><button onclick="switchTab('analytics')" id="nav-analytics">📊 Desempenho & Analytics</button></li>
        </ul>
    </sidebar>

    <main>
        <!-- ABA: HÁBITOS -->
        <div id="tab-habits" class="tab-content">
            <h1>Monitor de Hábitos</h1>
            <div class="card">
                <div id="habitsContainer"></div>
            </div>
        </div>

        <!-- ABA: PROJETOS & TAREFAS -->
        <div id="tab-projects" class="tab-content">
            <h1>Projetos & Tarefas</h1>
            <div class="card">
                <h3>Adicionar Nova Tarefa</h3>
                <form id="taskForm" onsubmit="handleAddTask(event)">
                    <select id="taskProjectSelect" required></select>
                    <input type="text" id="taskNameInput" placeholder="Nome da atividade..." required>
                    <input type="date" id="taskDueDateInput">
                    <label style="font-size: 13px; color: var(--text-secondary);">Recorrência:</label>
                    <select id="taskRecurrenceInput">
                        <option value="none">Nenhuma</option>
                        <option value="daily">Diária</option>
                        <option value="weekly">Semanal</option>
                        <option value="monthly">Mensal</option>
                    </select>
                    <button type="submit" class="btn">Adicionar Tarefa</button>
                </form>
            </div>
            <div id="projectsContainer"></div>
        </div>

        <!-- ABA: FINANÇAS -->
        <div id="tab-finances" class="tab-content">
            <h1>Controle Financeiro</h1>
            <div class="card">
                <div id="financesContainer">Carregando finanças...</div>
            </div>
        </div>

        <!-- ABA: METAS -->
        <div id="tab-goals" class="tab-content">
            <h1>Metas Anuais</h1>
            <div class="card">
                <div id="goalsContainer">Carregando metas...</div>
            </div>
        </div>

        <!-- ABA: CALENDÁRIO -->
        <div id="tab-calendar" class="tab-content">
            <h1>Calendário & Eventos</h1>
            <div class="card">
                <div id="calendarContainer">Carregando eventos...</div>
            </div>
        </div>

        <!-- ABA: ANALYTICS -->
        <div id="tab-analytics" class="tab-content">
            <h1>Desempenho & Analytics</h1>
            <div class="analytics-grid">
                <div class="stat-card">
                    <h3>Taxa de Conclusão de Hábitos</h3>
                    <div class="stat-value" id="habitRateValue">0%</div>
                    <div class="stat-sub" id="habitRateComparison">Calculando comparativo...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE EDIÇÃO DE TAREFA -->
    <div id="editTaskModal" class="modal">
        <div class="modal-content">
            <h3>Editar Tarefa</h3>
            <input type="hidden" id="editProjectId">
            <input type="hidden" id="editTaskId">
            <label style="font-size: 13px; margin-top: 8px; display:block;">Nome:</label>
            <input type="text" id="editTaskName">
            <label style="font-size: 13px; display:block;">Data Limite:</label>
            <input type="date" id="editTaskDueDate">
            <label style="font-size: 13px; display:block;">Recorrência:</label>
            <select id="editTaskRecurrence">
                <option value="none">Nenhuma</option>
                <option value="daily">Diária</option>
                <option value="weekly">Semanal</option>
                <option value="monthly">Mensal</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 16px;">
                <button class="btn" onclick="saveEditedTask()">Salvar</button>
                <button class="btn" style="background: var(--text-secondary);" onclick="closeEditModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Estado inicial carregado do seu backup Life OS
        let appData = JSON.parse(localStorage.getItem('lifeOSData')) || {
            "habits": [
                { "id": 1, "name": "Beber 2L de Água", "logs": { "2026-10-18": true, "2026-10-19": true } },
                { "id": 1792254521420, "name": "Duolingo", "targetDays": 7, "logs": { "2026-11-09": true } },
                { "id": 1792254550041, "name": "Exercício Físico", "targetDays": 5, "logs": { "2026-11-09": true } }
            ],
            "projects": [
                {
                    "id": 1792253858237,
                    "name": "Aulas Inglês",
                    "tasks": [
                        { "id": 1793566867512, "name": "Criar aula Saulo", "dueDate": "2026-11-15", "done": false, "pomodoros": 0, "recurrence": "weekly" },
                        { "id": 1793566861033, "name": "Criar aula Saulo", "dueDate": "2026-11-08", "done": true, "pomodoros": 0, "recurrence": "weekly" }
                    ]
                }
            ],
            "finances": [],
            "goals": [],
            "events": []
        };

        function saveData() {
            localStorage.setItem('lifeOSData', JSON.stringify(appData));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            
            if (tabId === 'projects') renderProjects();
            if (tabId === 'habits') renderHabits();
            if (tabId === 'analytics') renderAnalytics();
            if (tabId === 'finances') renderFinances();
            if (tabId === 'goals') renderGoals();
            if (tabId === 'calendar') renderCalendar();
        }

        // --- RENDER HÁBITOS ---
        function renderHabits() {
            const container = document.getElementById('habitsContainer');
            let html = `<table class="habits-table"><tr><th>Hábito</th><th>Meta/sem</th></tr>`;
            appData.habits.forEach(h => {
                html += `<tr><td style="text-align:left; font-weight:500;">${h.name}</td><td>${h.targetDays || 7}x</td></tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;
        }

        // --- RENDER PROJETOS & TAREFAS ---
        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            const select = document.getElementById('taskProjectSelect');
            
            select.innerHTML = '';
            appData.projects.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });

            let html = '';
            appData.projects.forEach(p => {
                const openTasks = p.tasks.filter(t => !t.done);
                const completedTasks = p.tasks.filter(t => t.done);

                html += `
                    <div class="card project-card">
                        <div class="project-title">${p.name}</div>
                        <div class="task-list">
                `;

                if (openTasks.length === 0) {
                    html += `<p style="font-size:13px; color:var(--text-secondary); padding: 8px 0;">Nenhuma atividade em aberto 🎉</p>`;
                } else {
                    openTasks.forEach(t => {
                        html += renderTaskItem(p.id, t);
                    });
                }

                html += `</div>`;

                // Bloco contraído de concluídas
                if (completedTasks.length > 0) {
                    html += `
                        <div class="completed-section-container">
                            <button class="toggle-completed-btn" onclick="toggleCompleted(${p.id})">
                                <span id="arrow-${p.id}">▶</span> Atividades Concluídas (${completedTasks.length})
                            </button>
                            <div id="completed-box-${p.id}" class="completed-tasks-list" style="display: none;">
                    `;
                    completedTasks.forEach(t => {
                        html += renderTaskItem(p.id, t);
                    });
                    html += `</div></div>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function renderTaskItem(projectId, t) {
            const recLabel = t.recurrence && t.recurrence !== 'none' ? ` <small style="color:var(--accent-color)">[🔄 ${t.recurrence}]</small>` : '';
            return `
                <div class="task-item ${t.done ? 'done' : ''}">
                    <div class="task-left">
                        <input type="checkbox" class="habit-checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask(${projectId}, ${t.id})">
                        <span>${t.name} ${t.dueDate ? '(' + t.dueDate + ')' : ''}${recLabel}</span>
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon" title="Cronômetro / Pomodoro">⏱️</button>
                        <button class="btn-icon" onclick="openEditModal(${projectId}, ${t.id})" title="Editar Tarefa">✏️</button>
                    </div>
                </div>
            `;
        }

        function toggleCompleted(projectId) {
            const box = document.getElementById(`completed-box-${projectId}`);
            const arrow = document.getElementById(`arrow-${projectId}`);
            if (box.style.display === 'none') {
                box.style.display = 'block';
                arrow.textContent = '▼';
            } else {
                box.style.display = 'none';
                arrow.textContent = '▶';
            }
        }

        function toggleTask(projectId, taskId) {
            const proj = appData.projects.find(p => p.id === projectId);
            if (!proj) return;
            const task = proj.tasks.find(t => t.id === taskId);
            if (!task) return;

            task.done = !task.done;

            // Lógica de Recorrência Inteligente ao concluir
            if (task.done && task.recurrence && task.recurrence !== 'none' && task.dueDate) {
                let nextDate = new Date(task.dueDate);
                if (task.recurrence === 'daily') nextDate.setDate(nextDate.getDate() + 1);
                else if (task.recurrence === 'weekly') nextDate.setDate(nextDate.getDate() + 7);
                else if (task.recurrence === 'monthly') nextDate.setMonth(nextDate.getMonth() + 1);

                const nextDateStr = nextDate.toISOString().split('T')[0];
                
                // Cria nova ocorrência em aberto
                proj.tasks.push({
                    id: Date.now(),
                    name: task.name,
                    dueDate: nextDateStr,
                    done: false,
                    pomodoros: 0,
                    recurrence: task.recurrence
                });
            }

            saveData();
            renderProjects();
        }

        function handleAddTask(event) {
            event.preventDefault();
            const projectId = Number(document.getElementById('taskProjectSelect').value);
            const name = document.getElementById('taskNameInput').value;
            const dueDate = document.getElementById('taskDueDateInput').value;
            const recurrence = document.getElementById('taskRecurrenceInput').value;

            const proj = appData.projects.find(p => p.id === projectId);
            if (proj) {
                proj.tasks.push({
                    id: Date.now(),
                    name,
                    dueDate: dueDate || null,
                    done: false,
                    pomodoros: 0,
                    recurrence
                });
                saveData();
                document.getElementById('taskNameInput').value = '';
                document.getElementById('taskDueDateInput').value = '';
                renderProjects();
            }
        }

        // --- MODAL DE EDIÇÃO ---
        function openEditModal(projectId, taskId) {
            const proj = appData.projects.find(p => p.id === projectId);
            const task = proj.tasks.find(t => t.id === taskId);
            
            document.getElementById('editProjectId').value = projectId;
            document.getElementById('editTaskId').value = taskId;
            document.getElementById('editTaskName').value = task.name;
            document.getElementById('editTaskDueDate').value = task.dueDate || '';
            document.getElementById('editTaskRecurrence').value = task.recurrence || 'none';
            
            document.getElementById('editTaskModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editTaskModal').style.display = 'none';
        }

        function saveEditedTask() {
            const projectId = Number(document.getElementById('editProjectId').value);
            const taskId = Number(document.getElementById('editTaskId').value);
            const proj = appData.projects.find(p => p.id === projectId);
            const task = proj.tasks.find(t => t.id === taskId);

            task.name = document.getElementById('editTaskName').value;
            task.dueDate = document.getElementById('editTaskDueDate').value || null;
            task.recurrence = document.getElementById('editTaskRecurrence').value;

            saveData();
            closeEditModal();
            renderProjects();
        }

        // --- ANALYTICS & COMPPARATIVO SEMANAL ---
        function renderAnalytics() {
            // Cálculo simulado/real robusto para taxa de hábitos e semana anterior
            const today = new Date();
            const formatDate = (d) => d.toISOString().split('T')[0];

            let currWeekSuccess = 0, currWeekTotal = 0;
            let prevWeekSuccess = 0, prevWeekTotal = 0;

            appData.habits.forEach(h => {
                if (!h.logs) return;
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(today.getDate() - i);
                    const dateStr = formatDate(d);
                    currWeekTotal++;
                    if (h.logs[dateStr]) currWeekSuccess++;
                }
                for (let i = 7; i < 14; i++) {
                    const d = new Date();
                    d.setDate(today.getDate() - i);
                    const dateStr = formatDate(d);
                    prevWeekTotal++;
                    if (h.logs[dateStr]) prevWeekSuccess++;
                }
            });

            const currRate = currWeekTotal > 0 ? (currWeekSuccess / currWeekTotal) * 100 : 0;
            const prevRate = prevWeekTotal > 0 ? (prevWeekSuccess / prevWeekTotal) * 100 : 0;
            const diff = currRate - prevRate;

            document.getElementById('habitRateValue').textContent = currRate.toFixed(1) + '%';
            
            const compEl = document.getElementById('habitRateComparison');
            const diffFormatted = (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%';
            if (diff >= 0) {
                compEl.innerHTML = `<span class="text-success">${diffFormatted} em relação à semana anterior</span>`;
            } else {
                compEl.innerHTML = `<span class="text-danger">${diffFormatted} em relação à semana anterior</span>`;
            }
        }

        // --- OUTRAS ABAS ---
        function renderFinances() {
            document.getElementById('financesContainer').innerHTML = `<p>${appData.finances.length} registros financeiros carregados com sucesso.</p>`;
        }
        function renderGoals() {
            document.getElementById('goalsContainer').innerHTML = `<p>${appData.goals.length} metas cadastradas.</p>`;
        }
        function renderCalendar() {
            document.getElementById('calendarContainer').innerHTML = `<p>${appData.events.length} eventos no calendário.</p>`;
        }

        // Inicializa na aba de projetos ou hábitos
        window.onload = () => {
            switchTab('projects');
        };
    </script>
</body>
</html>
